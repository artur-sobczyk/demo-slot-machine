<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Card Slots</title>
<link href="cardslots.css" rel="stylesheet" type="text/css">
</head>

<body>
  <div id="appframe">
    <img id="slot_L" src="hart_q.png" height="199" width="80" alt="slot wheel 1"/>

  <script src="app.bundle.js"></script>
